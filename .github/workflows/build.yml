name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_jars:
        description: '构建成功后发布 Jar（master 正式版，其他分支预发布）'
        type: boolean
        default: false
      run_server_smoke:
        description: '运行服务器启动/命令/停服烟测（不会测试真实玩家握手）'
        type: boolean
        default: false
      accept_minecraft_eula:
        description: '已阅读并接受 https://aka.ms/MinecraftEULA（烟测必须明确勾选）'
        type: boolean
        default: false
      server_jar_url:
        description: '烟测服务器 Jar 的可信 HTTPS 下载地址，必须为 Minecraft 26.1.2'
        type: string
      server_jar_sha256:
        description: '服务器 Jar 的 SHA-256，烟测时必填'
        type: string

permissions:
  contents: read

concurrency:
  group: netsqueeze-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Verify release automation rules
        run: python -I scripts/ci/test_check_release.py
      - name: Build and protocol regression tests
        run: |
          if [ ! -f gradle/verification-metadata.xml ]; then
            echo '::warning::Dependency baseline not yet committed. Run Dependency baseline on a trusted revision and review its artifact.'
          fi
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace --dependency-verification strict
      - name: Verify packaged jars and generate SHA-256
        run: python -I scripts/ci/verify_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NetSqueeze
          path: dist/*
          if-no-files-found: error
          retention-days: 14
      - name: Upload test evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: |
            build/reports/tests/
            build/test-results/
            client/build/reports/tests/
            client/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  client-compat:
    name: Client API checks ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        minecraft: ['26.1', '26.1.1', '26.2', '26.3']
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-read-only: true
      - name: Compile client and verify native API targets
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          chmod +x gradlew
          ./gradlew :client:build -PminecraftVersion="$MC_VERSION" --no-daemon --stacktrace --dependency-verification strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: client-tests-${{ matrix.minecraft }}
          path: client/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish verified JARs
    if: >-
      github.actor != 'dependabot[bot]' && startsWith(github.ref, 'refs/heads/') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_jars))
    needs: [build, client-compat]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NetSqueeze
          path: dist
      - name: Check release and tag (fail on authentication or API errors)
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -I scripts/ci/check_release.py
      - name: Publish verified build outputs
        if: steps.release.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS.txt
          args=(--repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes)
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease --latest=false --notes "自动构建预发布：CI 编译与自动化测试通过，真实 VC/Fabric 联调仍待验收。来源提交：$GITHUB_SHA。")
          else
            args+=(--latest)
          fi
          gh release create "$TAG" "NetSqueeze-$VERSION-all.jar" "NetSqueeze-Client-$VERSION.jar" SHA256SUMS.txt "${args[@]}"

  server-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.run_server_smoke
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit EULA acceptance
        env:
          ACCEPT_EULA: ${{ inputs.accept_minecraft_eula }}
        run: test "$ACCEPT_EULA" = true
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: NetSqueeze
          path: dist
      - name: Download pinned server to isolated directory
        env:
          SERVER_URL: ${{ inputs.server_jar_url }}
          SERVER_SHA256: ${{ inputs.server_jar_sha256 }}
        run: |
          [[ "$SERVER_URL" == https://* ]]
          [[ "$SERVER_SHA256" =~ ^[a-fA-F0-9]{64}$ ]]
          mkdir "$RUNNER_TEMP/nsq-server-download"
          curl --fail --location --max-time 120 --proto '=https' --proto-redir '=https' "$SERVER_URL" -o "$RUNNER_TEMP/nsq-server-download/server.jar"
          printf '%s  %s\n' "$SERVER_SHA256" "$RUNNER_TEMP/nsq-server-download/server.jar" | sha256sum --check
      - name: Startup, commands, shutdown
        run: |
          python -I scripts/ci/runtime_smoke.py --server-jar "$RUNNER_TEMP/nsq-server-download/server.jar" \
            --plugin-jar dist/*-all.jar --runtime-dir "$RUNNER_TEMP/nsq-runtime" --accept-eula
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: server-smoke-logs
          path: ${{ runner.temp }}/nsq-runtime/logs/
          if-no-files-found: warn
