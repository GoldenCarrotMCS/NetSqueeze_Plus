name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 自动建 tag 和 Release 要用

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # 缓存 ~/.gradle(依赖、paperweight 与 Loom 反编译出的 Minecraft),不缓存每次都要重新反编译好几分钟
      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: NetSqueeze
          path: |
            build/libs/*-all.jar
            client/build/libs/NetSqueeze-Client-*.jar
          if-no-files-found: error

      # 发版不用手动打 tag:推到 master 时读插件版本号,GitHub 上还没有 v<版本号> 的 Release 就自动建 tag 并发布;
      # 版本号没改的普通提交只构建不发版
      - name: Read version
        id: ver
        run: |
          version=$(tr -d '\r' < build.gradle.kts | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check release
        id: rel
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release
        if: steps.rel.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: NetSqueeze ${{ steps.ver.outputs.version }}
          files: |
            build/libs/*-all.jar
            client/build/libs/NetSqueeze-Client-*.jar
          generate_release_notes: true
