name: NetSqueeze
version: '${version}'
main: me.albert.netsqueeze.NetSqueeze
api-version: '1.21'
folia-supported: true
depend: [ CoreLib ]
commands:
  netsqueeze:
    description: 影子压缩统计，估算换成跨包流式压缩后下行能省多少
    usage: /netsqueeze [players|reset|pipeline]
    aliases: [ nsq ]
    permission: netsqueeze.admin
permissions:
  netsqueeze.admin:
    description: 使用 /netsqueeze 统计命令
    default: op
